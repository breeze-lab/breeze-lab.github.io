<!-- Generic head-and-shoulders placeholder for members without a photograph.
     Deliberately abstract: a plain circle and shoulder arc, no facial features,
     no hair, no gendered silhouette.
     Background is TRANSPARENT so the portrait card surface shows through and it
     works in both light and dark themes.
     NB this is XML: never put a double hyphen inside a comment. -->
