<!-- Favicon: the unfurled atom from the site logo (see _includes/logo.svg).
     Drawn for small sizes rather than copied from the logo: the logo's 2px
     strokes turn into an unreadable blob at 16px, so the orbits are heavier and
     flatter and a mask punches a clear ring around the nucleus.

     This is the STATIC fallback. js/favicon.js replaces it with an animated
     spinning version at runtime, except under prefers-reduced-motion.

     NB the mask is deliberately maskUnits="userSpaceOnUse" and the group
     carries NO transform. An earlier version wrapped the orbits in
     translate(20 20), which put the mask content in the translated coordinate
     system — the mask rect landed at 20..60 instead of 0..40 and clipped most
     of the atom away. Rotate about an explicit centre instead.

     NB this is XML: never put a double hyphen inside a comment. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <style>
    .orbit { fill: none; stroke: #14181f; stroke-width: 2.8; }
    .nucleus { fill: #14181f; }
    @media (prefers-color-scheme: dark) {
      .orbit { stroke: #fafafa; }
      .nucleus { fill: #fafafa; }
    }
  </style>

  <mask id="core-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
    <rect x="0" y="0" width="40" height="40" fill="#fff" />
    <circle cx="20" cy="20" r="7" fill="#000" />
  </mask>

  <g mask="url(#core-gap)">
    <ellipse class="orbit" cx="20" cy="20" rx="16" ry="4.6" />
    <ellipse class="orbit" cx="20" cy="20" rx="16" ry="4.6" transform="rotate(60 20 20)" />
    <ellipse class="orbit" cx="20" cy="20" rx="16" ry="4.6" transform="rotate(120 20 20)" />
  </g>

  <circle class="nucleus" cx="20" cy="20" r="5.2" />
</svg>
