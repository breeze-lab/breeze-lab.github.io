<!-- Favicon: the atom from the site logo (see _includes/logo.svg), kept simple.
     Three shells and a core, nothing else.

     An earlier version added a knockout ring and orbiting electrons, to make
     the mark legible at 16px and to give the animation something to move. It
     read as a snowflake rather than an atom, so it went.

     The background is OPAQUE on purpose. The PNG fallbacks cannot adapt to the
     browser's colour scheme the way an SVG can, and a near-white mark on
     transparency vanished against Finder and any light tab chrome. An opaque
     badge is legible everywhere, and keeps every asset looking the same.

     NB this is XML: never put a double hyphen inside a comment. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <rect width="40" height="40" fill="#14181f" />
  <g fill="none" stroke="#fafafa" stroke-width="2.6">
    <ellipse cx="20" cy="20" rx="17" ry="5.6" />
    <ellipse cx="20" cy="20" rx="17" ry="5.6" transform="rotate(60 20 20)" />
    <ellipse cx="20" cy="20" rx="17" ry="5.6" transform="rotate(120 20 20)" />
  </g>
  <circle cx="20" cy="20" r="4.6" fill="#fafafa" />
</svg>
