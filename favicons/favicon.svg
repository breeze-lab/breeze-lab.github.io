<!-- Favicon: the unfurled atom from the site logo (see _includes/logo.svg).
     Drawn for small sizes, not copied from the logo: the logo's 2px strokes
     and tight lobes turn into an unreadable blob at 16px. So the orbits are
     heavier and flatter, and a mask punches a clear ring around the nucleus so
     it still reads as a core rather than merging with the shells.
     Adapts to the browser's light/dark chrome, which modern browsers honour
     inside an SVG favicon.
     Keep in step with the PNG fallbacks alongside it.
     NB this is XML: never put a double hyphen inside a comment. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <style>
    .orbit { fill: none; stroke: #14181f; stroke-width: 2.8; }
    .nucleus { fill: #14181f; }
    @media (prefers-color-scheme: dark) {
      .orbit { stroke: #fafafa; }
      .nucleus { fill: #fafafa; }
    }
  </style>

  <mask id="core-gap">
    <rect width="40" height="40" fill="#fff" />
    <circle cx="20" cy="20" r="7" fill="#000" />
  </mask>

  <g mask="url(#core-gap)" transform="translate(20 20)">
    <ellipse class="orbit" rx="16" ry="4.6" />
    <ellipse class="orbit" rx="16" ry="4.6" transform="rotate(60)" />
    <ellipse class="orbit" rx="16" ry="4.6" transform="rotate(120)" />
  </g>

  <circle class="nucleus" cx="20" cy="20" r="5.2" />
</svg>
